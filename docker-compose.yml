version: '3.8'

services:
  mt5-trader:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mt5_ai_auto_trader
    restart: always
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./database/backups:/app/database/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
